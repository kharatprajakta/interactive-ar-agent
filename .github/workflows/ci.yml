# Checks every push and pull request: code compiles, the Compose files are
# valid, and all three images build. Nothing is published here (see release.yml).
# Copyright (c) 2026 PacificAI. All rights reserved.
name: CI

on:
  push:
    branches: [main, 'feature/**', ui-changes]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q tts_server.py ncert

      - name: Compose files are valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-password-123/' .env
          docker compose config --quiet
          GHCR_OWNER=ci OLLAMA_VERSION=0.0.0 docker compose -f compose.yaml -f deploy/compose.prod.yaml --profile public config --quiet

  images:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/node.Dockerfile
            target: ''
          - name: voice
            dockerfile: docker/python.Dockerfile
            target: voice
          - name: ncert
            dockerfile: docker/python.Dockerfile
            target: ncert
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
