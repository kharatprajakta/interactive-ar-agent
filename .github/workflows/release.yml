# Publishes the images to GitHub Container Registry (private to this repo's owner):
#   ghcr.io/<owner>/hello-crew-app, -voice, -ncert
# Tags: "main" + short SHA on every push to main; "1.2.3" / "1.2" / "latest" for a v1.2.3 tag.
# Production pulls these (deploy/compose.prod.yaml). A deploy job can be added
# here later, once the production server exists (see docs/DEPLOYMENT.md).
# Copyright (c) 2026 PacificAI. All rights reserved.
name: Release images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/node.Dockerfile
            target: ''
          - name: voice
            dockerfile: docker/python.Dockerfile
            target: voice
          - name: ncert
            dockerfile: docker/python.Dockerfile
            target: ncert
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hello-crew-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.vendor=PacificAI
            org.opencontainers.image.licenses=LicenseRef-PacificAI-Proprietary
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
