<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101218" />
    <title>Hello Crew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- ================= Landing: who do you want to call? ================= -->
    <main id="home" class="home">
      <header class="home-head">
        <h1>Hello Crew</h1>
        <p>Your AI friends, each with their own room, voice and speciality. Tap to start a hands-free video call.</p>
      </header>
      <div id="notice" class="notice" hidden></div>
      <ul id="contacts" class="contacts" aria-label="People you can call"></ul>
      <footer class="home-foot">
        Runs locally with Ollama. Characters and rooms by <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0).
      </footer>
    </main>

    <!-- ================= The call ================= -->
    <section id="call" class="call" hidden>
      <div id="stage" class="stage"></div>

      <!-- Everything below stays visible inside WebXR (DOM overlay). -->
      <div id="call-ui" class="call-ui">
        <header class="call-top">
          <div class="who">
            <span class="live-dot" aria-hidden="true"></span>
            <div>
              <div id="call-name" class="call-name"></div>
              <div class="call-meta"><span id="call-role"></span> · <span id="call-timer">0:00</span></div>
            </div>
          </div>
          <div id="call-status" class="call-status" data-state="idle">Connecting…</div>
        </header>

        <div id="study-chip" class="study-chip" hidden></div>
        <div id="hint" class="hint" hidden></div>

        <video id="selfview" class="selfview" playsinline muted hidden></video>

        <div class="captions" aria-live="polite">
          <p id="cap-agent" class="cap cap-agent"></p>
          <p id="cap-user" class="cap cap-user"></p>
        </div>

        <nav class="controls" aria-label="Call controls">
          <button id="btn-mic" class="ctl" aria-pressed="true" title="Microphone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/><path class="off" d="M19 11h-2a5 5 0 0 1-.4 1.97l1.5 1.5A6.96 6.96 0 0 0 19 11ZM15 11V5a3 3 0 0 0-5.94-.6L15 10.34V11ZM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.53 2.58l1.46 1.46A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 3.08-1.1L19.73 21 21 19.73 4.27 3Z"/></svg>
            <span>Mic</span>
          </button>
          <button id="btn-cam" class="ctl" aria-pressed="false" title="Show my camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
            <span>Camera</span>
          </button>
          <button id="btn-chat" class="ctl" aria-pressed="false" title="Chat, files and links">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1Z"/></svg>
            <span>Chat</span>
            <b id="doc-count" class="badge" hidden></b>
          </button>
          <button id="btn-ar" class="ctl" hidden title="Bring them into your room">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3L18.9 8 12 11.7 5.1 8 12 4.3ZM5 9.7l6 3.3v6.7l-6-3.3V9.7Zm8 10v-6.7l6-3.3v6.7l-6 3.3Z"/></svg>
            <span>AR</span>
          </button>
          <button id="btn-end" class="ctl end" title="End call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9Z"/></svg>
            <span>End</span>
          </button>
        </nav>

        <!-- Chat drawer: transcript, typed messages, files and links -->
        <aside id="drawer" class="drawer" hidden>
          <div class="drawer-head">
            <strong>Chat</strong>
            <button id="btn-drawer-close" class="icon-btn" aria-label="Close chat">✕</button>
          </div>
          <div id="docs" class="docs" hidden></div>
          <div id="log" class="log"></div>
          <form id="link-form" class="link-form" hidden>
            <input id="link-input" type="url" placeholder="Paste a web link to share…" required />
            <button type="submit">Add</button>
          </form>
          <form id="composer" class="composer">
            <button type="button" id="btn-attach" class="icon-btn" aria-label="Upload a PDF or text file" title="Upload PDF / text">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5v10a4.5 4.5 0 1 1-9 0V5a3 3 0 1 1 6 0v10.5a1.5 1.5 0 1 1-3 0V6.5H9v9a3 3 0 1 0 6 0V5a4.5 4.5 0 1 0-9 0v11.5a6 6 0 1 0 12 0v-10h-1.5Z"/></svg>
            </button>
            <button type="button" id="btn-link" class="icon-btn" aria-label="Share a link" title="Share a link">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0Zm-2.8 5.6a4 4 0 0 1-2.83-6.83l2.12-2.12 1.42 1.41-2.13 2.13a2 2 0 1 0 2.83 2.83l2.12-2.13 1.42 1.42-2.13 2.12A4 4 0 0 1 7.8 19Zm7.07-5.66-1.41-1.41 2.12-2.12a2 2 0 1 0-2.83-2.83l-2.12 2.12-1.42-1.41 2.13-2.13a4 4 0 1 1 5.66 5.66l-2.13 2.12Z"/></svg>
            </button>
            <input id="file-input" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" hidden />
            <input id="text" type="text" autocomplete="off" placeholder="Type a message…" />
            <button type="submit" class="send">Send</button>
          </form>
        </aside>

        <!-- Ringing / connecting screen -->
        <div id="ringing" class="ringing">
          <div class="ring-avatar"><img id="ring-img" alt="" /></div>
          <div id="ring-name" class="ring-name"></div>
          <div id="ring-text" class="ring-text">Calling…</div>
          <button id="btn-cancel" class="ctl end" aria-label="Cancel call">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
